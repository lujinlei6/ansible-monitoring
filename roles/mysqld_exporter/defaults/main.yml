# ============================================================
# mysqld_exporter 角色默认变量
# 说明：本角色的全部环境相关变量（MySQL 地址/端口/监控账号/密码、
#       NodePort、命名空间）统一定义在 group_vars/all.yml，
#       以保持"全工程只有一个环境变量文件"的原则，此处不重复定义。
#       如需为角色增加非环境类参数（如临时清单路径、等待超时），
#       在此处补充默认值即可，group_vars 中同名变量会覆盖本文件。
# ============================================================
