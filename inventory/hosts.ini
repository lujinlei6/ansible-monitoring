# ============================================================
# k8s-mall 监控体系 —— 主机清单
# 组名会被 site.yml 和各模板引用，新增节点时在此追加即可
# ============================================================

[prometheus]
prometheus ansible_host=192.168.1.40
[grafana]
grafana ansible_host=192.168.1.41
[monitor:children]
prometheus
grafana

[k8s_masters]
master01 ansible_host=192.168.1.61
master02 ansible_host=192.168.1.62
master03 ansible_host=192.168.1.63

[k8s_workers]
worker-1 ansible_host=192.168.1.71
worker-2 ansible_host=192.168.1.72
worker-3 ansible_host=192.168.1.73

# 组合分组：K8s 节点 = 控制面 + 工作节点
[k8s_nodes:children]
k8s_masters
k8s_workers

# 组合分组：所有需要装 node_exporter 的主机
[all_nodes:children]
k8s_nodes
monitor


[all:vars]
ansible_python_interpreter=/usr/bin/python3
